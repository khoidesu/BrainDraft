<!DOCTYPE html>
<html class="h-full light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BrainDraft</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap"
        rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        "body": ["Inter", "sans-serif"],
                        "code": ["JetBrains Mono", "monospace"]
                    },
                    colors: {
                        primary: '#2563eb',
                        'primary-dark': '#3b82f6',
                    }
                }
            }
        }
    </script>
    <!-- Use Tailwind CDN's CSS capability to inject our custom styles properly, since we are using CDN. But since style.css has @apply, it might not work directly without a build step unless we use standard CSS. 
         Wait, @tailwind directives in a standard CSS file linked via <link> won't be processed by the CDN.
         Let's convert style.css to use standard CSS because the CDN doesn't process external CSS files with @apply. 
         I will do that later. For now, I'll link it. -->
    <script src="GlassSurface.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body
    class="h-full font-body flex flex-col overflow-hidden text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- App Background Layer -->
    <div id="app-background" class="fixed inset-0 w-full h-full z-[-1] bg-cover bg-center bg-no-repeat bg-gray-50 dark:bg-gray-950 transition-all duration-500"></div>

    <!-- Minimal Top NavBar -->
    <header
        class="relative flex justify-between items-center w-full px-6 h-16 shrink-0 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 z-10 transition-colors duration-300">


        <div class="flex items-center gap-4 relative z-10">
            <span class="text-xl font-bold text-primary dark:text-primary-dark">BrainDraft</span>
        </div>
        <div class="flex items-center gap-2 sm:gap-4 relative">
            <!-- Search Bar -->
            <div class="relative flex items-center hidden sm:flex" id="search-container">
                <span class="material-symbols-outlined absolute left-3 text-gray-500 dark:text-gray-400">search</span>
                <input type="text" id="search-input" placeholder="Search clips..."
                    class="pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-800 border-transparent focus:border-primary focus:bg-white dark:focus:bg-gray-900 rounded-full text-sm w-48 focus:w-64 transition-all duration-300 outline-none text-gray-900 dark:text-gray-100">
            </div>

            <!-- Filter Button & Dropdown -->
            <div class="relative">
                <button id="filter-btn"
                    class="text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-full transition-colors flex items-center justify-center">
                    <span class="material-symbols-outlined">filter_list</span>
                </button>
                <div id="filter-dropdown"
                    class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-20 py-2">
                    <div
                        class="px-4 py-2 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                        Filter by Category</div>
                    <div id="filter-category-list" class="max-h-48 overflow-y-auto">
                        <!-- Categories dynamically injected here -->
                    </div>
                </div>
            </div>

            <!-- Wallpaper Settings Toggle -->
            <button id="bg-settings-toggle"
                class="text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-full transition-colors flex items-center justify-center" title="Background Settings">
                <span class="material-symbols-outlined">wallpaper</span>
            </button>

            <!-- Dark Mode Toggle -->
            <button id="dark-mode-toggle"
                class="text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-full transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined" id="dark-mode-icon">dark_mode</span>
            </button>

            <!-- Profile -->
            <img alt="User profile avatar"
                class="w-8 h-8 rounded-full border border-gray-200 dark:border-gray-700 cursor-pointer hover:opacity-80 transition-opacity ml-2"
                src="https://i.pinimg.com/736x/23/6e/40/236e402b2fafcdd019aba49861f38961.jpg" />
        </div>
    </header>

    <!-- Chat History Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-6 w-full max-w-4xl mx-auto no-scrollbar pb-4"
        id="chat-container">
        <!-- Clips will be injected here dynamically -->
    </main>

    <!-- Chat Input at Bottom -->
    <div class="w-full pt-4 pb-6 px-4 shrink-0 pointer-events-none">
        <div class="max-w-4xl mx-auto pointer-events-auto">
            <glass-surface border-radius="16" width="100%" displace="5" background-opacity="0.08" brightness="55"
                blur="14">
                <div class="flex flex-col relative group w-full">

                    <!-- Active Category Badge inside Input Area -->
                    <div id="active-category-indicator" class="hidden px-4 pt-3 flex items-center gap-2">
                        <span
                            class="text-xs font-semibold px-2 py-1 rounded-md text-white flex items-center gap-1 shadow-sm"
                            id="active-category-badge">
                            <span class="material-symbols-outlined text-[14px]">sell</span>
                            <span id="active-category-name">General</span>
                            <button id="clear-category-btn" class="ml-1 hover:text-gray-200"><span
                                    class="material-symbols-outlined text-[14px]">close</span></button>
                        </span>
                    </div>

                    <div class="flex items-end">
                        <div class="flex flex-col justify-end p-3 pl-4 pb-3 relative">
                            <button id="tag-btn"
                                class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-full transition-colors flex items-center justify-center"
                                title="Set Category">
                                <span class="material-symbols-outlined text-[20px]">sell</span>
                            </button>

                            <!-- Categories Dropdown (Upwards) -->
                            <div id="category-dropdown"
                                class="hidden absolute bottom-full left-0 mb-2 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-20 py-2">
                                <button id="create-new-cat-btn"
                                    class="w-full text-left px-4 py-2 text-sm text-primary dark:text-primary-dark hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-2 font-semibold">
                                    <span class="material-symbols-outlined text-[18px]">add</span> Create New
                                </button>
                                <div class="border-t border-gray-100 dark:border-gray-700 my-1"></div>
                                <div id="category-list" class="max-h-48 overflow-y-auto">
                                    <!-- Categories dynamically injected here -->
                                </div>
                            </div>
                        </div>

                        <textarea id="chat-input" placeholder="Paste or type a new clip..." rows="1"
                            class="flex-1 bg-transparent border-none focus:ring-0 text-base py-4 pl-2 pr-6 resize-none placeholder-gray-400 dark:placeholder-gray-500 min-h-[56px] max-h-[200px] outline-none text-gray-900 dark:text-gray-100"></textarea>

                        <div class="flex flex-col justify-end p-3 pr-4 pb-3">
                            <button id="send-btn"
                                class="bg-primary hover:bg-blue-700 text-white p-2 rounded-full transition-colors flex items-center justify-center shadow-sm">
                                <span class="material-symbols-outlined text-[20px]">send</span>
                            </button>
                        </div>
                    </div>
                </div>
            </glass-surface>
        </div>
    </div>

    <!-- Create Category Modal overlay -->
    <div id="category-modal"
        class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div
            class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-sm modal-animate overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">New Category</h3>
                <button id="close-modal-btn"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Category
                        Name</label>
                    <input type="text" id="new-cat-name"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:border-primary dark:bg-gray-700 dark:text-white"
                        placeholder="e.g. Snippets">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Color Label</label>
                    <div class="flex gap-2 flex-wrap" id="color-picker">
                        <!-- Colors injected by JS -->
                    </div>
                </div>
            </div>
            <div
                class="px-6 py-4 bg-gray-50 dark:bg-gray-900/50 flex justify-end gap-3 border-t border-gray-200 dark:border-gray-700">
                <button id="cancel-cat-btn"
                    class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancel</button>
                <button id="save-cat-btn"
                    class="px-4 py-2 text-sm font-semibold text-white bg-primary hover:bg-blue-700 rounded-lg transition-colors shadow-sm">Create</button>
            </div>
        </div>
    </div>

    <!-- Mobile Search overlay (for smaller screens) -->
    <div id="mobile-search-overlay" class="hidden fixed inset-0 bg-white dark:bg-gray-900 z-50 p-4 sm:hidden">
        <div class="flex items-center gap-2">
            <button id="close-mobile-search" class="text-gray-600 dark:text-gray-400 p-2"><span
                    class="material-symbols-outlined">arrow_back</span></button>
            <input type="text" id="mobile-search-input" placeholder="Search clips..."
                class="flex-1 bg-gray-100 dark:bg-gray-800 px-4 py-2 rounded-full outline-none text-gray-900 dark:text-gray-100 border-transparent focus:border-primary">
        </div>
    </div>

    <!-- Background Settings Modal -->
    <div id="bg-settings-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-sm modal-animate overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">Background Settings</h3>
                <button id="close-bg-modal-btn" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Desktop Background URL</label>
                    <input type="text" id="desktop-bg-input" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:border-primary dark:bg-gray-700 dark:text-white" placeholder="https://example.com/image.jpg">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Mobile Background URL</label>
                    <input type="text" id="mobile-bg-input" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:border-primary dark:bg-gray-700 dark:text-white" placeholder="https://example.com/mobile-img.jpg">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Blur Intensity</label>
                        <span id="blur-value-display" class="text-xs text-gray-500 dark:text-gray-400">0px</span>
                    </div>
                    <input type="range" id="bg-blur-slider" min="0" max="40" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700">
                </div>
                <button id="clear-bg-btn" class="text-sm text-red-500 hover:text-red-700 font-semibold pt-2">Clear Backgrounds</button>
            </div>
            <div class="px-6 py-4 bg-gray-50 dark:bg-gray-900/50 flex justify-end gap-3 border-t border-gray-200 dark:border-gray-700">
                <button id="cancel-bg-btn" class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancel</button>
                <button id="save-bg-btn" class="px-4 py-2 text-sm font-semibold text-white bg-primary hover:bg-blue-700 rounded-lg transition-colors shadow-sm">Apply Settings</button>
            </div>
        </div>
    </div>

    <!-- Login Modal overlay -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm modal-animate overflow-hidden border border-gray-200 dark:border-gray-700 relative">
            <div class="px-6 py-6 text-center">
                <div class="w-16 h-16 bg-primary/10 dark:bg-primary-dark/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-3xl text-primary dark:text-primary-dark">lock</span>
                </div>
                <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Restricted Access</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Please enter the master password to access your clipboard.</p>
                <div class="relative">
                    <input type="password" id="login-password-input" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary dark:text-white text-center text-lg tracking-widest" placeholder="••••••••">
                </div>
                <p id="login-error-msg" class="text-red-500 text-sm font-semibold mt-3 hidden">Incorrect password</p>
            </div>
            <div class="px-6 py-4 bg-gray-50 dark:bg-gray-900/50 flex justify-center border-t border-gray-200 dark:border-gray-700">
                <button id="login-submit-btn" class="w-full px-4 py-3 text-base font-semibold text-white bg-primary hover:bg-blue-700 rounded-xl transition-colors shadow-md">Unlock</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
